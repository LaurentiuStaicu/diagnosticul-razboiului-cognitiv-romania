    <title>4.3. Matricea comportamentală a lui Carlo M. Cipolla și alunecarea în autosabotaj colectiv (Diagnosticul războiului cognitiv în România)</title>
    <meta name="description" content="În matricea carteziană a lui Cipolla, cauza primară endogenă a destabilizării este spolierea sistemică exercitată de actorii extractivi interni din Cadranul IV (+X, -Y) asupra cetățeanului vulnerabil din Cadranul II (-X, +Y) prin barajul extractiv vertical și fisurarea planșeului constituțional orizontal. Războiul cognitiv rus intervine ca un catalizator exogen oportunist, care exploatează scontarea hiperbolică a viitorului (hyperbolic discounting, Laibson, 1997) și deturnarea pedepsei altruiste (Fehr &amp; Gächter, 2002) în revanșă simbolică autodistructivă (spiteful punishment) pentru a împinge victima în Cadranul III al autosabotajului colectiv (-X, -Y), în timp ce tranziția restaurativă spre Cadranul I (+X, +Y) depinde de arhitectura alegerii instituționale (Thaler &amp; Sunstein, 2008)." />

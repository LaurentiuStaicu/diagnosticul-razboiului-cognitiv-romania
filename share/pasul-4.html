    <title>1.3. Faliile demografice, uzura alostatică și vulnerabilizarea neurocognitivă a populației (Diagnosticul războiului cognitiv în România)</title>
    <meta name="description" content="Polarizarea dintre România metropolitană și cea periferică, emigrația masivă și insecuritatea cronică vulnerabilizează diferențiat arhitectura decizională pe cele două falii sociodemografice: în mediile afectate de precaritate și umilință birocratică, uzura alostatică și hipercortizolemia inhibă funcțional cortexul prefrontal dorsolateral (dlPFC) și forțează comutarea pe Sistemul 1 reactiv, în timp ce în bulele urbane educate retrase în servicii private, absența gândirii activ deschise deturnează un Sistem 2 biologic intact în disraționalitate și raționalizare motivată (myside bias). Această stare neurocognitivă nespecifică devine vulnerabilitate politică abia atunci când partidele democratice tradiționale generează un vid de reprezentare (Peter Mair), pe care actorii politici oportuniști (Cas Mudde) și operațiunile externe de control reflexiv îl exploatează direct." />

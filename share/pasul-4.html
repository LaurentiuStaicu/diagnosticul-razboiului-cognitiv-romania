    <title>1.3. Faliile demografice, uzura alostatică și vulnerabilizarea neurocognitivă a populației (Diagnosticul războiului cognitiv în România)</title>
    <meta name="description" content="Polarizarea dintre România metropolitană și cea periferică, emigrația masivă și insecuritatea cronică vulnerabilizează transversal arhitectura decizională prin două regimuri neurocognitive care se întrepătrund în societate: sub presiunea precarității și a umilinței birocratice, uzura alostatică cronică (aplatizarea curbei circadiene a cortizolului, desensibilizarea receptorilor glucocorticoizi, inflamația sistemică și retracția dendritică în dlPFC) forțează comutarea pe Sistemul 1 reactiv, în timp ce în mediile urbane cu educație formală ridicată, pe lângă episoadele de epuizare executivă, absența gândirii activ deschise deturnează Sistemul 2 în disraționalitate și raționalizare motivată (myside bias) — fie pentru justificarea elitistă a secesiunii civice, fie pentru elaborarea unor raționalizări pseudosavante și radical-revizioniste. Această stare neurocognitivă devine vulnerabilitate politică atunci când partidele democratice tradiționale generează un vid de reprezentare (Mair, 2013), pe care actorii politici oportuniști (Mudde, 2004) și operațiunile externe de control reflexiv îl exploatează direct." />

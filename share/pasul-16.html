    <title>6.1. Faza I: Decompresia alostatică, reglementarea ecosistemului digital și reducerea poverii cognitive (Diagnosticul războiului cognitiv în România)</title>
    <meta name="description" content="Nicio campanie de verificare factuală sau educație mediatică nu poate reuși asupra unei populații aflate în plină uzură alostatică și capturare dopaminergică. De aceea, Faza I operează sincronizat pe două paliere temporale: (a) fereastra tactică de triaj acut (0–72 de ore în criză), care oprește contagiunea Traseului A prin comunicare strategică CDC CERC, măsuri tehnice DSA de limitare a amplificării algoritmice și înghețarea în 24–72h a fluxurilor financiare ilicite; și (b) orizontul structural de decompresie alostatică (0–12 luni), care scade cortizolul bazal prin debirocratizare digitală după modelul e-Estonia și servicii publice accesibile." />

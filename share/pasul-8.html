    <title>3.1. Deturnarea fazei de orientare din bucla OODA și compromiterea filtrului moral prin control reflexiv de rang secund (Diagnosticul războiului cognitiv în România)</title>
    <meta name="description" content="Războiul cognitiv nu se limitează la știri false în faza de Observare, ci țintește centrul de greutate al buclei OODA: faza de Orientare analizată de Boyd. Prin control reflexiv de rang secund în sensul lui Lefebvre — automatizat astăzi prin algoritmi comerciali de recomandare —, operațiunea injectează o „scurtătură predictivă” (Friston, 2010) care comprimă artificial incertitudinea, menține ținta la un rang reflexiv inferior (Rangul 0/1) și o comută din primul sistem etic al cooperării procedurale în al doilea sistem etic al confruntării și anihilării." />

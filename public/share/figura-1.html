    <title>Figura 1. Arhitectura cauzală pe trei straturi a vulnerabilității societale endogene (Diagnosticul războiului cognitiv în România)</title>
    <meta name="description" content="Deficitele structurale din Stratul A — deficitul de servicii publice, închiderea operațională incompletă a instituțiilor, mediul socioeconomic precar și vidul de reprezentare politică (Peter Mair, Cas Mudde) — induc în Stratul B o dublă vulnerabilitate neurocognitivă: pe de o parte, stresul alostatic cronic și hipervigilența amigdaliană care inhibă deliberarea prefrontală (dlPFC) și comută procesarea pe Sistemul 1 reactiv în periferiile afectate de precaritate; pe de altă parte, recrutarea unui Sistem 2 biologic intact în disraționalitate și raționalizare motivată (Stanovich, 2009; Kahan, 2017) pentru apărarea statutului în bulele urbane. Prin cele trei mecanisme transformaționale Micro–Macro (sincronizarea afectivă, contagiunea complexă prin punți largi și intermedierea politică oportunistă), aceste procese se sedimentează în Stratul C sub forma fatalismului defensiv, a neputinței învățate și a neîncrederii cronice în ordinea constituțională, oferind vectorului de război cognitiv un teren vulnerabil pe care îl poate exploata direct și amplifica." />
    <meta name="author" content="Laurențiu Staicu" />

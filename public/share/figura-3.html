    <title>Figura 3 (Mecanismul cibernetic și semiotic al capturării cognitive în al șaselea domeniu operațional) · Diagnosticul războiului cognitiv în România</title>
    <meta name="description" content="Fluxul informațional brut din faza de Observare, amplificat algoritmic prin capturarea circuitelor dopaminergice, intră în faza de Orientare, unde modelele mentale și culturale ale subiectului sunt țintite de controlul reflexiv de rang secund. Această intervenție compromite filtrul axiologic al primului sistem etic, blochează calea medierii ternare și a discernământului rațional prefrontal și deviază procesarea pe traseul celui de-al doilea sistem etic și al logicii binare a anihilării. Rezultatul este o fază de Decizie dominată de selecția emoțională indusă, închiderea cognitivă și cogniția protectoare a identității, care se traduce în faza de Acțiune prin polarizare socială acută și conflict antiinstituțional." />

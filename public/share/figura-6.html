    <title>Figura 6 (Bifurcarea procesării neurocognitive sub presiunea crizei acute) (Diagnosticul războiului cognitiv în România)</title>
    <meta name="description" content="La întâlnirea stimulului de criză acută în nodul de bifurcație cognitivă, absența reglării executive deviază procesarea pe Track A (sus, marcat cu roșu), unde hiperactivarea amigdaliană, inhibiția cortexului prefrontal dorsolateral și capturarea dopaminergică a atenției produc paralizie decizională, furie și o buclă de autoamplificare reactivă. În contrast, activarea conexiunilor prefrontale și a capacității negative orientează procesarea pe Track B (jos, marcat cu galben-muștar), permițând analiza deliberativă, validarea epistemică și comunitară în regim de mediere ternară și generând reziliență și acțiune suverană." />
